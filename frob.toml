check_base = "main"

[graph]
exclude = ["dist/**", "examples/**"]


[gates.severity]
# Legacy-adoption baseline: snapshot-wide obligations warn on the
# un-annotated legacy surface while annotation coverage grows; diff-scoped
# and drift rules stay hard errors.
COV001 = "warn"
TEST001 = "warn"
TEST002 = "warn"
TEST003 = "warn"
TEST005 = "warn"
TEST006 = "warn"

[testing]
min_unit_cases = 1
min_integration = 1
unit_branch_cov = 90
module_line_cov = 85
system_line_cov = 80

[[test.runner]]
language = "python"
command = [".venv/bin/pytest", "-q", "{ids}"]
all_command = [".venv/bin/pytest", "-q"]
cwd = "."

# T-0008: these entrypoints are read by something OUTSIDE this project's
# own tracked-file graph (GitHub Actions, `make`, a release-time script,
# a human/GitHub reader, `uv sync`/`uv run`), never referenced by name
# from source the way an import or a doc link would be. Declaring them
# here (the same `[[refs.entrypoint]]` idiom frob's own frob.toml uses)
# is the correct fix for REF001/REF002 -- not a per-project waiver.
[[refs.entrypoint]]
path = ".github/workflows/*.yml"
reason = "read by GitHub Actions outside this repo's own tracked-file graph, never imported/referenced from source"

[[refs.entrypoint]]
path = "Makefile"
reason = "read by `make` outside this repo's own tracked-file graph, not referenced from source"

[[refs.entrypoint]]
path = "scripts/bump_version.py"
reason = "release-time executable run by scripts/release.py and CI, never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/install.py"
reason = "bootstrap executable run by the `install` Makefile target, never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/develop.py"
reason = "bootstrap executable run by the `develop` Makefile target, never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/clean.py"
reason = "build executable run by the `clean` Makefile target and scripts/release.py's own logic path, never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/build.py"
reason = "build executable run by the `build` Makefile target, never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/release.py"
reason = "release-time executable run by the `release` Makefile target, never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/typecheck_oracle.py"
reason = "typecheck-oracle executable run by the `mypy` Makefile target, never imported by tracked source"

[[refs.entrypoint]]
path = "CHANGELOG.md"
reason = "read by humans/GitHub at release time, not referenced by name from tracked source"

[[refs.entrypoint]]
path = "README.md"
reason = "read by humans/GitHub, a single pyproject.toml reference is expected, not fragile"

[[refs.entrypoint]]
path = "uv.lock"
reason = "read by `uv sync`/`uv run` outside this repo's own tracked-file graph, one CI workflow mention is expected, not fragile"

[[refs.entrypoint]]
path = "src/typani/py.typed"
reason = "PEP 561 marker read by type checkers/packaging tools by file presence, never imported by tracked source"

[[refs.entrypoint]]
path = ".gitattributes"
reason = "read by git outside this repo's own tracked-file graph, never referenced by name from tracked source"

[[refs.entrypoint]]
path = "crates/typani-core/Cargo.lock"
reason = "read by cargo/maturin outside this repo's own tracked-file graph, never referenced by name from tracked source"

[[refs.entrypoint]]
path = "crates/typani-core/rust-toolchain.toml"
reason = "read by rustup/cargo by file presence outside this repo's own tracked-file graph, never referenced by name from tracked source"

[[refs.entrypoint]]
path = "mypy-py310.ini"
reason = "read by mypy via --config-file in CI/local invocations, never referenced by name from tracked source"

[[refs.entrypoint]]
path = "src/typani/singleton.pyi"
reason = "type stub read by type checkers by file presence alongside singleton.py, never imported by tracked source"

[[refs.entrypoint]]
path = "tests/conftest.py"
reason = "pytest fixture module discovered by pytest via file-presence convention, never imported by name from tracked source"

[[refs.entrypoint]]
path = "tests/fixtures/lint/typ003_functions.py"
reason = "TYP003 fixture loaded by test_lint.py via file path at test time, not imported by name"

[[refs.entrypoint]]
path = "src/typani/lint/__main__.py"
reason = "`python -m typani.lint` entry point invoked by module path, never imported by name from tracked source"

[[refs.entrypoint]]
path = "scripts/check.py"
reason = "the local gate front door, run by `make check` and by hand; never imported by tracked source"

[[refs.entrypoint]]
path = "scripts/_common.py"
reason = "shared helper imported by every scripts/*.py through a sys.path insert (scripts are run by path, not as a package); the import is real but not a tracked-file reference the scan resolves"

# T-0025: standard open-source community files. GitHub and human readers
# discover these by file-presence convention (repo root, .github/), never
# by name from tracked source.
[[refs.entrypoint]]
path = "LICENSE"
reason = "read by GitHub/packaging tools by file-presence convention, never referenced by name from tracked source"

[[refs.entrypoint]]
path = "CODE_OF_CONDUCT.md"
reason = "read by GitHub/humans by file-presence convention, never referenced by name from tracked source"

[[refs.entrypoint]]
path = ".github/ISSUE_TEMPLATE/*.yml"
reason = "read by GitHub's issue-form UI by file-presence convention, never referenced by name from tracked source"

[[refs.entrypoint]]
path = ".github/PULL_REQUEST_TEMPLATE.md"
reason = "read by GitHub's PR-creation UI by file-presence convention, never referenced by name from tracked source"
