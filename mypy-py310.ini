[mypy]
python_version = 3.10
strict = true
warn_unused_configs = true
disallow_any_generics = false
files = src

# typani_core is the optional native extension; absent on pure-only
# environments by design (see src/typani/_impl.py).
[mypy-typani_core]
ignore_missing_imports = True

# T-0039: the CLI's config-file layer imports tomllib inside a
# try/ModuleNotFoundError -- absent on 3.10 by design, where the file layer
# is skipped rather than failing (docs/cli.md#appconfig). This oracle pins
# python_version = 3.10, so the import is deliberately unresolvable here.
[mypy-tomllib]
ignore_missing_imports = True
