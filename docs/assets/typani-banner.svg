<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="typani: typed value types for Python. Rust-shaped Result and Option, Zig-shaped error sets, native speed.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#101724"/>
    </linearGradient>
    <radialGradient id="glowOk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowErr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0883e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#a5b8cc"/>
    </linearGradient>
    <linearGradient id="okFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="errFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa657"/>
      <stop offset="1" stop-color="#db6d28"/>
    </linearGradient>
    <clipPath id="markClip"><rect x="70" y="70" width="180" height="180" rx="40"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="260" fill="url(#glowOk)"/>
  <circle cx="1080" cy="300" r="300" fill="url(#glowErr)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#3fb950" opacity="0.35"/>

  <!-- mark: one value, two variants. Ok above the diagonal, Err below. -->
  <g clip-path="url(#markClip)">
    <rect x="70" y="70" width="180" height="180" fill="#161c27"/>
    <polygon points="70,70 250,70 70,250" fill="url(#okFill)"/>
    <polygon points="250,70 250,250 70,250" fill="url(#errFill)"/>
    <line x1="70" y1="250" x2="250" y2="70" stroke="#0b0f16" stroke-width="10"/>
  </g>
  <rect x="70" y="70" width="180" height="180" rx="40" fill="none" stroke="#2b3648" stroke-width="2"/>
  <!-- Ok glyph: check -->
  <polyline points="103,132 121,150 152,112" fill="none" stroke="#0b0f16" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Err glyph: cross -->
  <line x1="176" y1="176" x2="210" y2="210" stroke="#0b0f16" stroke-width="12" stroke-linecap="round"/>
  <line x1="210" y1="176" x2="176" y2="210" stroke="#0b0f16" stroke-width="12" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="300" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="url(#wordmark)">typani</text>
  <!-- tagline -->
  <text x="304" y="204" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b98a8">Typed value types for Python. Rust-shaped Result and Option, Zig-shaped error sets.</text>

  <!-- code ribbon -->
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="20">
    <text x="304" y="252" fill="#56d364">Ok(value)</text>
    <text x="428" y="252" fill="#ffa657">Err(error)</text>
    <text x="566" y="252" fill="#79c0ff">Some(x)</text>
    <text x="668" y="252" fill="#8b98a8">Nothing()</text>
    <text x="800" y="252" fill="#d2a8ff">@propagate</text>
    <text x="946" y="252" fill="#8b98a8">.unwrap()</text>
  </g>

  <!-- native badge -->
  <g transform="translate(1000,70)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#161c27" stroke="#2b3648" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f0883e"/>
    <text x="34" y="22" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">Rust core</text>
  </g>
</svg>
