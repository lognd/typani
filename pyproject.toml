[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typani"
version = "0.2.0"
description = "Typed value types for Python: Rust-shaped Result and Option, Zig-shaped error sets, propagation, an optional Rust core, and a misuse lint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Logan Dapp", email = "logan@logand.app" }
]

dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
# T-0010: the native acceleration extra -- typani-core (crates/typani-core),
# a PyO3/maturin extension providing an accelerated Result/Option, pinned
# EXACT (`==`), not `>=`/`~=`, to typani's own version number. A loose pin
# on an ABI-coupled native extension produces skew nobody can reproduce:
# the pure-Python and native implementations must be built and released
# together, so the version string itself is the contract. Without this
# extra, typani still installs and runs in pure-Python mode. Unpublished
# until T-0010 lands; do not add to `uv sync --all-extras` until then.
native = ["typani-core==0.1.0"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a8",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "pydantic>=2.12",
    "maturin>=1.7,<2",
    "tomli>=2; python_version < \"3.11\"",
]

[project.urls]
Homepage = "https://github.com/lognd/typani"
Documentation = "https://github.com/lognd/typani#readme"
Source = "https://github.com/lognd/typani/src/typani"
Issues = "https://github.com/lognd/typani/issues"
Changelog = "https://github.com/lognd/typani/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = { find = { where = ["src"] } }
# T-0025: build-system.requires pins setuptools>=68, which predates the
# setuptools>=77 [project].license-files key (PEP 639). Use the classic
# [tool.setuptools] form instead of bumping the pin for this alone.
license-files = ["LICENSE"]

[tool.setuptools.package-data]
typani = ["py.typed", "lint/**"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Lint fixtures are deliberately misused typani code (the checker's own
# test data), never real imports.
"tests/fixtures/**" = ["E501", "F401", "F811", "F821", "F841"]

# typani_core is the optional native extension: absent on pure-only
# runners by design, so its import in the backend selector is not a
# resolvable module there. Same posture as frob's own native shim override.
[[tool.ty.overrides]]
include = ["src/typani/_impl.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ty.src]
include = ["src", "tests", "examples"]
# tests/fixtures/lint/** is deliberately broken code used as lint-rule test
# fixtures (unresolved names on purpose); tests/test_bump_version.py loads
# scripts/bump_version.py by file path via importlib and monkeypatches
# module-level path constants that don't exist in the static module shape
# ty sees -- both are intentionally untypeable, not type-check debt (T-0012).
exclude = ["tests/fixtures/lint/**", "tests/test_bump_version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.coverage.run]
source = ["src/typani"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

# T-0010: typani-core is not published to PyPI yet, so `uv lock` cannot
# resolve the `native` extra above against the package index. Point uv
# at a local placeholder package instead (crates/typani-core/pyproject.toml)
# so the lockfile can be generated today without a network round-trip to
# a package that does not exist there. The placeholder has no
# functionality; T-0010 replaces it with the real PyO3/maturin crate and
# this source override is dropped once typani-core has a real release.
[tool.uv.sources]
typani-core = { path = "crates/typani-core" }
