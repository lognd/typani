[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "typani-core"
version = "0.1.0"
description = "Native Result/Option kernels for typani (PyO3, abi3-py310)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
module-name = "typani_core"
features = ["pyo3/extension-module"]
include = ["typani_core.pyi", "py.typed"]
