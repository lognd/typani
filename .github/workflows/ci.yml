name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: install
        run: uv sync --all-groups

      - name: lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: typecheck (ty)
        run: uv run ty check src

      - name: typecheck (mypy oracle)
        run: uv run mypy --config-file mypy-py310.ini

      - name: test (pure python)
        run: uv run pytest -q -n auto
        env:
          TYPANI_PURE: "1"

  native:
    # T-0010: the native crate does not exist yet. This leg is a no-op
    # until crates/typani-core/Cargo.toml lands; guarded per-step so the
    # workflow stays green rather than failing on a missing crate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check for native crate
        id: native-check
        run: |
          if [ -f crates/typani-core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.native-check.outputs.present == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.native-check.outputs.present == 'true'
        with:
          # The crate is not at the repo root; rust-cache runs cargo metadata
          # here and fails (exit 101) without an explicit workspace path.
          workspaces: crates/typani-core -> target

      - uses: astral-sh/setup-uv@v5
        if: steps.native-check.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install python
        if: steps.native-check.outputs.present == 'true'
        run: uv python install 3.13

      - name: install
        if: steps.native-check.outputs.present == 'true'
        run: uv sync --all-groups

      - name: build native extension
        if: steps.native-check.outputs.present == 'true'
        run: uv run maturin develop --uv -m crates/typani-core/Cargo.toml

      - name: cargo test
        if: steps.native-check.outputs.present == 'true'
        run: cargo test --manifest-path crates/typani-core/Cargo.toml

      - name: test (native)
        if: steps.native-check.outputs.present == 'true'
        run: uv run pytest -q

  # frob check (the obligation-graph gate) is NOT run here yet: frob has no
  # stable PyPI release, so a CI job could only ever report UNMEASURED. It is
  # the local gate instead: `uv run python scripts/check.py` (or `make check`)
  # runs frob check plus the test suite under both backends. Reintroduce a
  # frob-check job (see git history of this file for its shape) once
  # `uv tool install frob` resolves to a release.
